<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button id="testHealth">Test Health Endpoint</button>
    <button id="testLogin">Test Login Endpoint</button>
    <button id="testTusUpload">Test TUS Upload</button>
    <div id="result"></div>

    <script>
        const result = document.getElementById('result');

        document.getElementById('testHealth').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:8080/health');
                const data = await response.json();
                result.innerHTML = `<pre>Health: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        });

        document.getElementById('testLogin').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                const data = await response.json();
                result.innerHTML = `<pre>Login: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        });

        document.getElementById('testTusUpload').addEventListener('click', async () => {
            try {
                result.innerHTML = '<pre>Creating TUS upload...</pre>';
                
                // Step 1: Create upload
                const createResponse = await fetch('http://localhost:8080/api/tus/', {
                    method: 'POST',
                    headers: {
                        'Tus-Resumable': '1.0.0',
                        'Upload-Length': '100',
                        'Upload-Metadata': 'filename dGVzdC5qcGc=,filetype aW1hZ2UvanBlZw==,stepId MQ=='
                    }
                });
                
                const uploadUrl = createResponse.headers.get('Location');
                result.innerHTML = `<pre>Upload created: ${uploadUrl}\n\nUploading chunk...</pre>`;
                
                // Step 2: Upload chunk
                const data = new Uint8Array(100).fill(0);
                const patchResponse = await fetch(uploadUrl, {
                    method: 'PATCH',
                    headers: {
                        'Tus-Resumable': '1.0.0',
                        'Upload-Offset': '0',
                        'Content-Type': 'application/offset+octet-stream'
                    },
                    body: data
                });
                
                const offset = patchResponse.headers.get('Upload-Offset');
                result.innerHTML = `<pre>✅ Upload successful!\n\nUpload URL: ${uploadUrl}\nFinal Offset: ${offset} bytes</pre>`;
            } catch (error) {
                result.innerHTML = `<pre>❌ Error: ${error.message}\n\n${error.stack}</pre>`;
            }
        });
    </script>
</body>
</html>
