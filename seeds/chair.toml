# Upholstered Dining Chair — batch workflow
#
# batch_size (default 6) controls the order quantity.
# Steps without an explicit batch_size get the recipe default.
#
# A step with batch_size = 6 creates 1 ticket ("process all 6").
# A step with batch_size = 1 creates 6 tickets ("one per piece").
# Per-piece steps must declare batch_size = 1 explicitly.
#
# Dependency wiring between different batch sizes:
#   fan-out (6→1): all per-piece tickets depend on the single batch ticket
#   1:1     (1→1): ticket N depends on ticket N
#   fan-in  (1→6): single batch ticket depends on all per-piece tickets
#
# Four parallel streams converge at glue-up:
#   1. Legs:  rough stock → mill → shape → mortises → hand shape  (batch)
#   2. Rails: rough stock → mill → shape → tenons → hand shape    (batch)
#   3. Back:  resaw veneers (batch) → lamination → shape           (per-piece)
#   4. Seat:  cut → foam → fabric → upholster                     (batch)
#
# Convergence:
#   dry fit (per-piece) → glue up → spray finish → install seat → done
#
# Import:  nori recipe create --from-toml seeds/chair.toml
# Pour:    nori recipe pour dining-chair --var batch_size=6

formula = "Apprentice Chair"

[recipe]
name = "dining-chair"
description = "Batch upholstered dining chair — four-stream build with upholstered seats"
version = 2
type = "workflow"

[vars]
wood_species = "Walnut"
batch_size = { description = "Number of chairs in the batch", type = "int", default = "6" }

# ── STREAM 1: Legs (all batch — 1 ticket per step) ───────────────

[[steps]]
id = "leg-rough-cut"
title = "Rough cut leg stock"
station = "miter-saw"
description = "Crosscut leg blanks to rough length from 8/4 stock."

[[steps]]
id = "leg-joint-face"
title = "Joint 1 face on legs"
station = "jointer"
needs = ["leg-rough-cut"]
description = "Reference face on the jointer. Mark with chalk triangle."

[[steps]]
id = "leg-thickness"
title = "Thickness plane legs"
station = "thickness-planer"
needs = ["leg-joint-face"]
description = "Plane to 1-3/4\" square."

[[steps]]
id = "leg-rough-shape"
title = "Rough cut out leg shape"
station = "band-saw"
needs = ["leg-thickness"]
description = "Band-saw the rough leg profile from the template."

[[steps]]
id = "leg-shape-profile"
title = "Shape leg profile"
station = "router-table"
needs = ["leg-rough-shape"]
description = "Route the final leg profile using the shaping template."

[[steps]]
id = "leg-face-mortises"
title = "Leg face mortises"
station = "assembly-table"
needs = ["leg-shape-profile"]
description = "Cut face mortises using the face mortising jig on the assembly table."

[[steps]]
id = "leg-edge-mortises"
title = "Leg edge mortises"
station = "assembly-table"
needs = ["leg-shape-profile"]
description = "Cut edge mortises using the edge mortising jig on the assembly table."

[[steps]]
id = "hand-shape-legs"
title = "Hand shape legs"
station = "roubo-workbench"
needs = ["leg-face-mortises", "leg-edge-mortises"]
description = "Final hand shaping of legs with spokeshave, rasp, and scraper."

# ── STREAM 2: Rails (all batch — 1 ticket per step) ──────────────

[[steps]]
id = "rail-rough-cut"
title = "Rough cut rail stock"
station = "miter-saw"
description = "Crosscut rail blanks to rough length."

[[steps]]
id = "rail-joint-face-edge"
title = "Jointer 1 face and 1 edge on rails"
station = "jointer"
needs = ["rail-rough-cut"]
description = "Joint one face and one edge for reference surfaces."

[[steps]]
id = "rail-thickness"
title = "Thickness plane rails"
station = "thickness-planer"
needs = ["rail-joint-face-edge"]
description = "Plane rails to 3/4\" thickness."

[[steps]]
id = "rail-rip-width"
title = "Rip rails to width"
station = "table-saw"
needs = ["rail-thickness"]
description = "Rip rails to final width on the table saw."

[[steps]]
id = "rail-compound-miters"
title = "Rail compound miters"
station = "table-saw"
needs = ["rail-rip-width"]
description = "Cut compound miters on rail ends."

[[steps]]
id = "rail-tenons"
title = "Rail tenons"
station = "panto-router"
needs = ["rail-compound-miters"]
description = "Cut tenons on the panto router. Sneak up on fit."

[[steps]]
id = "hand-shape-rails"
title = "Hand shape rails"
station = "roubo-workbench"
needs = ["rail-tenons"]
description = "Final hand shaping of rails with spokeshave and scraper."

# ── Dry fit (legs + rails converge, per-piece) ───────────────────

[[steps]]
id = "dry-fit"
title = "Dry fit legs + rails"
batch_size = 1
needs = ["hand-shape-legs", "hand-shape-rails"]
description = "Assemble without glue. Check for square, twist, and rack. Adjust joints as needed."

# ── STREAM 3: Chair back ─────────────────────────────────────────

[[steps]]
id = "resaw-veneers"
title = "Resaw veneers"
station = "band-saw"
description = "Resaw veneer layers on the bandsaw, then joint and thickness-plane to final dimension."

# Lamination forces per-piece — vacuum press handles one at a time.
# Each per-piece step in this stream declares batch_size = 1 explicitly.

[[steps]]
id = "glue-lamination"
title = "Glue lamination"
station = "assembly-table"
batch_size = 1
needs = ["resaw-veneers"]
description = "Glue up the bent lamination in the vacuum press on the assembly table."

[[steps]]
id = "true-up-edge"
title = "True up one edge of glue lamination"
station = "jointer"
batch_size = 1
needs = ["glue-lamination"]
description = "Joint one edge of the lamination for a reference surface."

[[steps]]
id = "rip-back-parallel"
title = "Rip back parallel"
station = "table-saw"
batch_size = 1
needs = ["true-up-edge"]
description = "Rip the back to final width, parallel to the jointed edge."

[[steps]]
id = "cut-back-miters"
title = "Cut chair back compound miters"
station = "table-saw"
batch_size = 1
needs = ["rip-back-parallel"]
description = "Cut compound miters on the chair back ends."

[[steps]]
id = "shape-back"
title = "Shape chair back"
station = "roubo-workbench"
batch_size = 1
needs = ["cut-back-miters"]
description = "Final shaping of the chair back with spokeshave and scraper."

# ── STREAM 4: Seat (all batch — 1 ticket per step) ──────────────

[[steps]]
id = "cut-seat-blank"
title = "Cut out seat blanks"
station = "table-saw"
description = "Cut the plywood seat blanks to shape on the table saw."

[[steps]]
id = "cut-foam"
title = "Cut out seat foam"
needs = ["cut-seat-blank"]
description = "Cut foam to match the seat blank shape."

[[steps]]
id = "cut-fabric"
title = "Cut out upholstery fabric"
needs = ["cut-foam"]
description = "Cut fabric with allowance for wrapping and stapling."

[[steps]]
id = "upholster-seat"
title = "Upholster seats"
needs = ["cut-fabric"]
description = "Wrap foam and fabric around the seat blanks, staple underneath."

# ── Assembly (dry-fit + back converge, per-piece) ────────────────

[[steps]]
id = "glue-up"
title = "Glue up chair assembly"
station = "assembly-table"
batch_size = 1
needs = ["dry-fit", "shape-back"]
description = "Full chair glue-up. Glue side frames first, then join front/back rails and back. Use cauls for even clamping pressure."

  [steps.gate]
  type = "timer"
  id = "cure-time"
  timeout = "4h"

[[steps]]
id = "spray-finish"
title = "Spray finish"
station = "spray-booth"
needs = ["glue-up"]
description = "Spray finish on the assembled chair frame."

# ── Final convergence (per-piece) ────────────────────────────────

[[steps]]
id = "install-seat"
title = "Install chair seat"
needs = ["upholster-seat", "spray-finish"]
description = "Mount the upholstered seat to the finished chair frame."

[[steps]]
id = "done"
title = "{{batch_size}} Chairs complete"
needs = ["install-seat"]
type = "milestone"
description = "All chairs assembled, finished, and seats installed. Ready for delivery."
