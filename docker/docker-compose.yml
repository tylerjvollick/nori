name: nori

# Production compose — no web dev server, no E2E vars, no NORI_ENV.
# Create docker/.env from docker/.env.example before running.

services:
  nori-migrate:
    container_name: nori-migrate
    build: ../server
    command: ["./nori", "migrate", "up"]
    environment:
      DB_HOST: database
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-nori}
      DB_PORT: 5432
    depends_on:
      database:
        condition: service_healthy

  nori-server:
    container_name: nori-server
    build: ../server
    environment:
      DB_HOST: database
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-nori}
      DB_PORT: 5432
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-1073741824}
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm}
      NORI_JWT_SECRET: ${NORI_JWT_SECRET}
      NORI_ADMIN_EMAIL: ${NORI_ADMIN_EMAIL:-admin@nori.dev}
      NORI_ADMIN_PASSWORD: ${NORI_ADMIN_PASSWORD}
      NORI_ACCOUNT_NAME: ${NORI_ACCOUNT_NAME:-My Shop}
      NORI_PORT: ${NORI_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
      nori-migrate:
        condition: service_completed_successfully
    ports:
      - "${NORI_HOST_PORT:-8081}:${NORI_PORT:-8080}"
    volumes:
      - nori_uploads:/app/uploads

  database:
    image: postgres:16
    container_name: nori-db
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nori}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nori_uploads:
